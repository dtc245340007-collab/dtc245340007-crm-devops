apiVersion: 1

groups:
  - orgId: 1
    name: CRM_Security_Rules
    folder: CRM
    interval: 10s
    rules:
      - uid: crm_bruteforce_detected
        title: CRM_BruteForce_Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
          alertname: CRM_BruteForce_Detected
        annotations:
          summary: "CRM Brute-Force Authentication Attack Detected"
          description: "More than 5 LOGIN_FAILED events detected in 1 minute from CRM Webapp."
