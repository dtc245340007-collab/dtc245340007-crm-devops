worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # An ninh: Ẩn thông tin phiên bản Nginx và upstream
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Định dạng log chi tiết phục vụ giám sát và truy vết sự cố qua Promtail + Loki
    log_format crm_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log crm_combined;

    # Rate Limiting: Phòng thủ tấn công Brute-Force vào trang xác thực
    limit_req_zone $binary_remote_addr zone=crm_login:10m rate=5r/m;
    limit_req_status 429;

    # Tối ưu hiệu năng
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    # Nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # =========================================================================
    # 1. CỔNG 8080 (HTTP) -> STUB STATUS CHO EXPORTER & CHUYỂN HƯỚNG 301 SANG HTTPS
    # =========================================================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name 192.168.207.128 localhost;

        # Stub status cho Prometheus Nginx Exporter nội bộ
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # Chuyển hướng 301 vĩnh viễn sang HTTPS cho các truy vấn còn lại
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. CỔNG 8443 (HTTPS) -> REVERSE PROXY & SECURITY HEADERS
    # =========================================================================
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name 192.168.207.128 localhost;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Chỉ cho phép TLSv1.2 và TLSv1.3
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Cấu hình SSL Session Cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HTTP Security Headers cơ bản ở cấp server (áp dụng với 'always')
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---------------------------------------------------------------------
        # 2.1 CRM Login với Rate Limiting (Phòng thủ Brute-Force)
        # ---------------------------------------------------------------------
        location = /login {
            limit_req zone=crm_login burst=10 nodelay;

            proxy_pass http://web:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self';" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # ---------------------------------------------------------------------
        # 2.2 Web CRM Application (Flask + Gunicorn)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Content-Security-Policy chặt chẽ cho ứng dụng CRM
            add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self';" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # ---------------------------------------------------------------------
        # 2.3 pgAdmin 4 Subpath (/pgadmin/)
        # ---------------------------------------------------------------------
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin:8080/;
            proxy_http_version 1.1;

            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_redirect off;

            # Ẩn CSP mặc định chứa http: của pgAdmin
            proxy_hide_header Content-Security-Policy;

            # Đảm bảo cookie có thuộc tính Secure và không bị lặp SameSite
            proxy_cookie_path / "/; Secure";
            proxy_set_header X-PGA-CSRFToken $http_x_pga_csrftoken;
            proxy_pass_header Set-Cookie;

            add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss:; img-src 'self' data: blob:;" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ---------------------------------------------------------------------
        # 2.4 Grafana Subpath (/grafana/)
        # ---------------------------------------------------------------------
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob:;" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ---------------------------------------------------------------------
        # 2.5 Prometheus Subpath (/prometheus/)
        # ---------------------------------------------------------------------
        location = /prometheus {
            return 301 /prometheus/;
        }

        location /prometheus/ {
            proxy_pass http://prometheus:9090;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob:;" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ---------------------------------------------------------------------
        # 2.5 Nginx Stub Status (Chỉ cho phép dải mạng nội bộ Docker và localhost)
        # ---------------------------------------------------------------------
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
