{% extends "base.html" %}

{% block title %}500 - Lỗi máy chủ nội bộ{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
    <h1 style="font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Đã xảy ra lỗi hệ thống (Internal Server Error)</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
        Hệ thống đang gặp sự cố khi xử lý yêu cầu. Vui lòng thử lại sau hoặc liên hệ quản trị viên để được hỗ trợ.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Quay lại Trang chủ</a>
</div>
{% endblock %}
