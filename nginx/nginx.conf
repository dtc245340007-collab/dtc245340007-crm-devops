user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # An ninh: Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Định dạng log chi tiết phục vụ giám sát và truy vết sự cố qua Promtail + Loki
    log_format crm_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log crm_combined;

    # Tối ưu hiệu năng
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    # Nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # =========================================================================
    # 1. CỔNG 80 (HTTP) -> TỰ ĐỘNG CHUYỂN HƯỚNG 301 SANG HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name 192.168.207.128 localhost;

        # Chuyển hướng 301 vĩnh viễn sang HTTPS
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # 2. CỔNG 443 (HTTPS) -> REVERSE PROXY & SECURITY HEADERS
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name 192.168.207.128 localhost;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Chỉ cho phép TLSv1.2 và TLSv1.3
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Cấu hình SSL Session Cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HTTP Security Headers cơ bản ở cấp server (áp dụng với 'always')
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---------------------------------------------------------------------
        # 2.1 Web CRM Application (Flask + Gunicorn)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Content-Security-Policy chặt chẽ cho ứng dụng CRM
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self';" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # ---------------------------------------------------------------------
        # 2.2 pgAdmin 4 Subpath (/pgadmin/)
        # ---------------------------------------------------------------------
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;

            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # CSP nới lỏng riêng cho pgAdmin: giao diện pgAdmin dùng dynamic eval, inline script/style và WebSocket
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss:; img-src 'self' data: blob:;" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ---------------------------------------------------------------------
        # 2.3 Grafana Subpath (/grafana/) - Chuẩn bị sẵn cho Bước 4
        # ---------------------------------------------------------------------
        # location /grafana/ {
        #     proxy_pass http://grafana:3000/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' data: blob:;" always;
        # }

        # ---------------------------------------------------------------------
        # 2.4 Nginx Stub Status (Chỉ cho phép dải mạng nội bộ Docker và localhost)
        # ---------------------------------------------------------------------
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
