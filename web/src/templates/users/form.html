{% extends "base.html" %}

{% block title %}{{ 'Chỉnh sửa' if user else 'Thêm mới' }} Nhân viên - CRM{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 1.25rem;">
        <a href="{{ url_for('users_list') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            &larr; Quay lại danh sách nhân viên
        </a>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;">
            {{ 'Chỉnh sửa Nhân viên' if user else 'Thêm Nhân viên Mới' }}
        </h1>
    </div>

    <div class="card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% if not user %}
            <div class="form-group">
                <label for="username">Tên đăng nhập (Username) <span style="color: var(--danger);">*</span></label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="nhanvien03">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu ban đầu <span style="color: var(--danger);">*</span></label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Mật khẩu >= 6 ký tự">
            </div>
            {% endif %}

            <div class="form-group">
                <label for="full_name">Họ và tên đầy đủ <span style="color: var(--danger);">*</span></label>
                <input type="text" id="full_name" name="full_name" class="form-control" value="{{ user.full_name if user else '' }}" required placeholder="Nguyễn Văn A">
            </div>

            <div class="form-group">
                <label for="role">Vai trò trong hệ thống</label>
                <select id="role" name="role" class="form-control">
                    <option value="staff" {% if user and user.role == 'staff' %}selected{% endif %}>Nhân viên CSKH (Staff)</option>
                    <option value="manager" {% if user and user.role == 'manager' %}selected{% endif %}>Quản lý (Manager)</option>
                </select>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">
                    {{ 'Lưu thay đổi' if user else 'Tạo tài khoản' }}
                </button>
                <a href="{{ url_for('users_list') }}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
