{% extends "base.html" %}

{% block title %}Chỉnh sửa Tương tác - CRM{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <div style="margin-bottom: 1.25rem;">
        <a href="{{ url_for('customer_detail', id=interaction.customer_id) }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
            &larr; Quay lại chi tiết khách hàng
        </a>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-top: 0.5rem;">
            Chỉnh sửa Tương tác
        </h1>
    </div>

    <div class="card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-row">
                <div class="form-group">
                    <label>Loại tương tác <span style="color: var(--danger);">*</span></label>
                    <select name="type" class="form-control" required>
                        <option value="call" {% if interaction.type == 'call' %}selected{% endif %}>Cuộc gọi</option>
                        <option value="email" {% if interaction.type == 'email' %}selected{% endif %}>Email</option>
                        <option value="meeting" {% if interaction.type == 'meeting' %}selected{% endif %}>Gặp mặt</option>
                        <option value="note" {% if interaction.type == 'note' %}selected{% endif %}>Ghi chú</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Người liên hệ</label>
                    <select name="contact_id" class="form-control">
                        <option value="">-- Không chọn --</option>
                        {% for ct in contacts %}
                        <option value="{{ ct.id }}" {% if interaction.contact_id == ct.id %}selected{% endif %}>
                            {{ ct.full_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Tiêu đề tương tác <span style="color: var(--danger);">*</span></label>
                <input type="text" name="subject" class="form-control" value="{{ interaction.subject }}" required>
            </div>

            <div class="form-group">
                <label>Nội dung chi tiết <span style="color: var(--danger);">*</span></label>
                <textarea name="content" class="form-control" rows="5" required>{{ interaction.content }}</textarea>
            </div>

            <div class="form-group">
                <label>Ngày nhắc chăm sóc tiếp theo (Next Follow-up)</label>
                <input type="date" name="next_follow_up" class="form-control" value="{{ interaction.next_follow_up.strftime('%Y-%m-%d') if interaction.next_follow_up else '' }}">
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                <a href="{{ url_for('customer_detail', id=interaction.customer_id) }}" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
