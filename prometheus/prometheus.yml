global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['localhost:9090']

  # 2. cAdvisor (Container metrics: CPU, RAM, Network I/O)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Nginx Prometheus Exporter (Active connections, requests/s, handled/accepted)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 4. PostgreSQL Exporter (pg_up, connections, xact/s, cache hit, db size, deadlocks)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
